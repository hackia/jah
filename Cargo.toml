[package]
name = "jah"
version = "0.1.0"
edition = "2024"

[dependencies]
cubefs = "0.1.1"
jinshu = "0.1.0"
kpack = "0.1.0"
noun = "0.1.0"
wuu = { version = "0.1.1", features = ["linux-keyboard"] }

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
opt-level = 2
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
